name: PR test report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests and save output
        run: |
          mkdir -p test-output
          npm test | tee test-output/results.txt
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output/results.txt
          retention-days: 7